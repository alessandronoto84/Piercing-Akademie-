# Cloudflare Worker der Piercing Akademie: Website (statisch), Login, Bezahlschranke für /kurs/, Stripe-Webhook.
# Geheimnisse NICHT hier eintragen, sondern mit `wrangler secret put NAME`:
#   STRIPE_SECRET_KEY      (rk_live_… eingeschränkter Schlüssel: nur „Checkout Sessions: Schreiben“)
#   STRIPE_WEBHOOK_SECRET  (whsec_…, Signatur der Stripe-Webhooks)
#   RESEND_API_KEY         (E-Mail-Versand)
#   CODE_PFEFFER           (zufälliger Text, sichert die Login-Codes zusätzlich)
name = "piercing-akademie"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "none"  # Seiten bleiben unter ihren .html-Adressen erreichbar (wie in Links, canonical und hreflang)
# Diese Pfade laufen immer zuerst durch den Worker (Login-Prüfung, API)
run_worker_first = ["/", "/en/", "/es/", "/kurs", "/kurs/*", "/api/*", "/pruefen"]

[triggers]
crons = ["17 2 * * *"]   # nächtliche Löschung nach den Fristen der Datenschutzerklärung

[vars]
DOMAIN = "https://piercingakademie.de"
MAIL_ABSENDER = "Piercing Akademie <kurs@piercingakademie.de>"
ADMIN_EMAILS = "diepiercingakademie@gmail.com"
MAX_GERAETE = "2"
ZUGANG_MONATE = "12"

[[d1_databases]]
binding = "DB"
database_name = "piercing-akademie"
database_id = "WIRD-BEIM-EINRICHTEN-ERSETZT"

# Privater Speicher für das Kursbuch (Seitenbilder und Suchtext im Ordner buch/, erzeugt mit werkzeuge/buch-seiten.py)
[[r2_buckets]]
binding = "DATEIEN"
bucket_name = "piercing-akademie-dateien"

# ---------- Testadresse (vor dem Umzug der Domains): npx wrangler deploy --env test ----------
# Eigene Datenbank, Stripe im Testmodus, kein Kursbuch (R2 noch nicht aktiv), für Suchmaschinen gesperrt.
# Resend schickt ohne bestätigte Domain nur vom Absender onboarding@resend.dev und nur an die E-Mail des Resend-Kontos.
[env.test]
name = "piercing-akademie-test"
workers_dev = true
assets = { directory = "./public", binding = "ASSETS", not_found_handling = "404-page", html_handling = "none", run_worker_first = true }

[env.test.vars]
DOMAIN = "https://piercing-akademie-test.alessandronoto84.workers.dev"
MAIL_ABSENDER = "Piercing Akademie <onboarding@resend.dev>"
ADMIN_EMAILS = "diepiercingakademie@gmail.com"
MAX_GERAETE = "2"
ZUGANG_MONATE = "12"
NICHT_INDEXIEREN = "1"

[[env.test.d1_databases]]
binding = "DB"
database_name = "piercing-akademie-test"
database_id = "d806822e-6830-4986-ba52-ac10047bf766"
