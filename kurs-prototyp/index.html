<script>
/* Sprache wählen und Inhalte laden. Reihenfolge: ?lang=de|en|es (wird gemerkt), gemerkte Wahl, Sprache des Kontos (PA_KONTO aus /kurs/konto.js),
   Browsersprache, sonst Deutsch. Übersetzte Inhalte liegen in inhalte/en/ und inhalte/es/, alles andere immer in inhalte/. */
(function () {
  var SPRACHEN = ["de", "en", "es"], MERKER = "pa-kurs-sprache", s = null;
  var gueltig = function (x) { x = String(x || "").toLowerCase().slice(0, 2); return SPRACHEN.indexOf(x) > -1 ? x : null; };
  var m = /[?&]lang=([^&#]*)/.exec(location.search);
  if (m && (s = gueltig(decodeURIComponent(m[1])))) { try { localStorage.setItem(MERKER, s); } catch (e) { /* Speicher gesperrt */ } }
  if (!s) { try { s = gueltig(localStorage.getItem(MERKER)); } catch (e) { s = null; } }
  if (!s && window.PA_KONTO) s = gueltig(window.PA_KONTO.sprache);
  if (!s) s = gueltig(navigator.language || (navigator.languages || [])[0]);
  s = s || "de";
  window.KURS_SPRACHE = s;
  document.documentElement.lang = s;
  var DATEIEN = ["modul-01.js", "modul-02.js", "modul-03.js", "modul-04.js", "modul-05.js", "modul-06.js", "modul-07.js", "modul-08.js", "modul-09.js", "modul-10.js", "modul-11.js",
    "grafiken.js", "grafiken-text.js", "bilder.js", "bilder-frei.js", "bilder-ki.js", "glossar-checklisten.js", "praxislabor.js", "clips.js", "fragen-generiert.js", "ui.js"];
  var JE_SPRACHE = /^(modul-\d\d|glossar-checklisten|praxislabor|fragen-generiert)\.js$/;
  var html = DATEIEN.map(function (d) { return '<script src="inhalte/' + (s !== "de" && JE_SPRACHE.test(d) ? s + "/" : "") + d + '"><\/script>'; }).join("\n");
  document.write(html + '\n<script src="kurs.js"><\/script>\n<script src="bewegung.js"><\/script>');
})();
</script>
